            "recipeYield": "4 personnes",
            "recipeIngredient": [
                "4 verres de riz",
                "2 cubes de bouillon de poule",
                "3 cuill\u00e8res \u00e0 soupe de cr\u00e8me \u00e9paisse",
                "3 \u00e9chalotes",
                "1 petits sachets de parmesan r\u00e2p\u00e9",
                "10 tranches de chorizo doux",
                "3 cuill\u00e8res \u00e0 soupe d'huile d'olive",
                "de paprika selon votre go\u00fbt",
                "poivre",
                "sel"
            ],
            "recipeInstructions": [
                {
                    "@type": "HowToStep",
                    "text": "Faire bouillir 1,5 litre d'eau puis ajoutez les 2 cubes de bouillon."
                },
                {
                    "@type": "HowToStep",
                    "text": "Emincer les \u00e9chalotes et couper le chorizo selon votre go\u00fbt (en 2 ou en 4)."
                },
                {
                    "@type": "HowToStep",
                    "text": "Dans un fait-tout faire chauffer l'huile, faire revenir les \u00e9chalotes 2 min, puis ajoutez le riz cru. Laisser chauffez jusqu'\u00e0 ce que les grains deviennent translucides."
                },
                {
                    "@type": "HowToStep",
                    "text": "Ajouter le bouillon au fur et \u00e0 mesure jusqu'au raz du riz. Couvrir, et ajouter du bouillon quand le niveau du liquide est trop bas."
                },
                {
                    "@type": "HowToStep",
                    "text": "Go\u00fbter le riz de temps en temps et continuer jusqu'\u00e0 \u00e9puisement du bouillon."
                },
                {
                    "@type": "HowToStep",
                    "text": "Ajouter la cr\u00e8me, le sel, le poivre, le paprika, le chorizo et le parmesan. Laisser cuire encore 5 min."
                },
                {
                    "@type": "HowToStep",
                    "text": "Servir bien chaud."
                }
            ],
